plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

import java.util.Locale

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

def normalizeOs = { String osName ->
    def normalized = osName.toLowerCase(Locale.ROOT)
    if (normalized.contains('mac') || normalized.contains('darwin')) return 'macos'
    if (normalized.contains('win')) return 'windows'
    if (normalized.contains('nux') || normalized.contains('linux')) return 'linux'
    normalized.replaceAll(/[^a-z0-9]+/, '')
}

def normalizeArch = { String arch ->
    def normalized = arch.toLowerCase(Locale.ROOT)
    if (normalized in ['x86_64', 'amd64']) return 'x86_64'
    if (normalized in ['aarch64', 'arm64']) return 'aarch64'
    normalized.replaceAll(/[^a-z0-9_]+/, '')
}

def hostPlatform = "${normalizeOs(System.getProperty('os.name'))}-${normalizeArch(System.getProperty('os.arch'))}"
def hostNativeDir = file("${rootDir}/core/build")
def stagedNativeDir = file("${projectDir}/build/native")

// C++ 빌드 결과물(네이티브 라이브러리)을 JAR 안의 /native/<os-arch>/ 로 번들
processResources {
    from(stagedNativeDir) {
        include '**/libxcelerate.so'
        include '**/libxcelerate.dylib'
        include '**/xcelerate.dll'
        into 'native'
    }

    from(hostNativeDir) {
        include 'libxcelerate.dylib'
        include 'libxcelerate.so'
        include 'xcelerate.dll'
        into "native/${hostPlatform}"
    }
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.INCLUDE
}

test {
    useJUnitPlatform()
    systemProperty 'java.library.path', "${rootDir}/core/build"
    environment 'DYLD_LIBRARY_PATH', "${rootDir}/core/build"  // macOS
    environment 'LD_LIBRARY_PATH',   "${rootDir}/core/build"  // Linux
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId    = project.group
            artifactId = 'xcelerate'
            version    = project.version
            from components.java

            pom {
                name        = 'Xcelerate'
                description = 'High-performance Excel/CSV streaming library using C++ native core'
                url         = 'https://github.com/dev-montyoh/xcelerate'
                licenses {
                    license {
                        name = 'MIT License'
                        url  = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id   = 'dev-montyoh'
                        name = 'Monty Oh'
                        email = 'ohhanjin0330@gmail.com'
                    }
                }
                scm {
                    url                 = 'https://github.com/dev-montyoh/xcelerate'
                    connection          = 'scm:git:git://github.com/dev-montyoh/xcelerate.git'
                    developerConnection = 'scm:git:ssh://github.com/dev-montyoh/xcelerate.git'
                }
            }
        }
    }
    repositories {
        // 로컬 스테이징 디렉토리: 이후 ZIP 번들로 묶어 Central Portal에 업로드
        maven {
            name = 'staging'
            url  = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

signing {
    // CI: signing.gnupg.keyName / signing.gnupg.passphrase 는
    // 워크플로우에서 ~/.gradle/gradle.properties 에 주입됨
    useGpgCmd()
    sign publishing.publications.maven
}
